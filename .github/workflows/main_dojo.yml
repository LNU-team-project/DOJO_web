name: Build and deploy ASP.Net Core app to Azure Web App - dojo

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Важливо для SonarCloud

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.x"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "zulu"

      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Install LibMan
        run: dotnet tool install --global Microsoft.Web.LibraryManager.Cli

      - name: Restore client-side libraries
        run: libman restore
        working-directory: src

      - name: Begin Sonar scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet-sonarscanner begin /k:"LNU-team-project_DOJO_web" /o:"lnu-team-project" \
          /d:sonar.token="$SONAR_TOKEN" \
          /d:sonar.host.url="https://sonarcloud.io" \
          /d:sonar.cs.vscoveragexml.reportsPaths=coverage.xml

      - name: Build
        run: dotnet build DOJO_web.sln --configuration Release

      - name: Run unit tests
        run: dotnet test DOJO_web.Tests/DOJO_web.Tests.csproj --configuration Release --no-build

      - name: End Sonar scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: dotnet publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: dotnet publish src/src.csproj -c Release -o ./publish_output

      - name: Upload artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ./publish_output

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@1384c340ab2dda50fed2bee3041d1d87018aa5e8
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_49160D571A4F448BA5529F5702548A94 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_738AF1F0DD2A4AE499F947F0213ADCDB }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4D3D57BAA04641DF87E8435B871A45A7 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@b686016b4de8820a23519503685d8d03fbfa03a6
        with:
          app-name: "dojo"
          slot-name: "Production"
          package: .
